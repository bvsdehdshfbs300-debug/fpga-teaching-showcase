name: 问题反馈
description: 页面、关卡、约束、波形或运行出现问题
title: "[问题] "
labels: []
body:
  - type: markdown
    attributes:
      value: "感谢反馈。这里是公开区域，请勿上传密码、Token、身份证明或不希望公开的作业。保留草稿，先不要清除浏览器数据。"
  - type: input
    id: location
    attributes:
      label: 发生在哪个页面或关卡？
      placeholder: 例如：第 2 关 / 约束面板 / 首页
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 如何复现？
      description: 从打开页面开始，描述点击了什么、输入了什么。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 你期望看到什么？
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际发生了什么？
      description: 可粘贴错误文字或必要截图；代码只提供最小复现片段。
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 设备与浏览器
      placeholder: 例如：Windows 11，Chrome；或安卓手机，QQ 浏览器
    validations:
      required: true
  - type: input
    id: network
    attributes:
      label: 若是访问/加载问题，可选填省份、运营商与大概时间
      description: 不需要提供详细地址或公网 IP。
